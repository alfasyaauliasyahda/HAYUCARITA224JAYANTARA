            useEffect(() => { localStorage.setItem('kkn224_articles', JSON.stringify(articles)); }, [articles]);
            useEffect(() => { localStorage.setItem('kkn224_gallery', JSON.stringify(gallery)); }, [gallery]);
            useEffect(() => { localStorage.setItem('kkn224_logbook', JSON.stringify(logbook)); }, [logbook]);
            useEffect(() => { localStorage.setItem('kkn224_documents', JSON.stringify(documents)); }, [documents]);
            useEffect(() => { localStorage.setItem('kkn224_attendance', JSON.stringify(attendance)); }, [attendance]);
            useEffect(() => { localStorage.setItem('kkn224_hero', JSON.stringify(heroContent)); }, [heroContent]);
            useEffect(() => { localStorage.setItem('kkn224_revisions', JSON.stringify(revisions)); }, [revisions]);

            // Toast notification helper
            const showToast = (message, type = 'success') => {

            // Audit log helper
            const logRevision = (action) => {

                    timestamp: new Date().toLocaleString('id-ID'),

            // Dynamic Stats derived directly from Database
            const stats = useMemo(() => ({
                totalMembers: members.length,

            // Universal Media Upload Helper Component (Option A: Upload File & Option B: Add URL)
            const UniversalMediaUploader = ({ onMediaAdded, label = "Tambah Media / Lampiran" }) => {
                const [mode, setMode] = useState('upload'); // 'upload' | 'url'
                const [dragOver, setDragOver] = useState(false);
                const [uploadProgress, setUploadProgress] = useState(0);
                const [isUploading, setIsUploading] = useState(false);
                
                // Form URL input
                const [urlInput, setUrlInput] = useState('');
                const [titleInput, setTitleInput] = useState('');
                const [typeInput, setTypeInput] = useState('image');

                const handleFiles = (fileList) => {
                    const files = Array.from(fileList);
                    if (files.length === 0) return;

                    setIsUploading(true);
                    setUploadProgress(10);

                    // Validate dangerous files
                    const invalidFile = files.find(f => {
                        const ext = f.name.split('.').pop().toLowerCase();
                        return BLOCKED_EXTENSIONS.includes(ext);
                    });

                    if (invalidFile) {
                        showToast(`File ${invalidFile.name} diblokir demi keamanan!`, 'error');
                        setIsUploading(false);
                        return;
                    }

                    // Simulate step upload progress
                    let prg = 20;
                    const interval = setInterval(() => {
                        prg += 25;
                        setUploadProgress(prg);
                        if (prg >= 100) {
                            clearInterval(interval);
                            setIsUploading(false);
                            
                            // Process valid files into persistent data URLs / Object URLs
                            files.forEach(file => {
                                const reader = new FileReader();
                                reader.onload = (e) => {
                                    const fileDataUrl = e.target.result;
                                    let mediaCategory = 'document';
                                    if (file.type.startsWith('image/')) mediaCategory = 'image';
                                    else if (file.type.startsWith('video/')) mediaCategory = 'video';

                                    const newAttachment = {
                                        id: 'att_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                                        title: file.name,
                                        url: fileDataUrl,
                                        fileType: file.type,
                                        fileSize: (file.size / 1024 / 1024).toFixed(2) + ' MB',
                                        mediaType: mediaCategory,
                                        uploadedAt: new Date().toLocaleDateString('id-ID'),
                                        uploadedBy: contributorName
                                    };
                                    onMediaAdded(newAttachment);
                                };
                                reader.readAsDataURL(file);
                            });
                            showToast(`Berhasil mengunggah ${files.length} file!`);
                        }
                    }, 200);
                };

                const handleUrlSubmit = (e) => {
                    e.preventDefault();
                    if (!urlInput.trim()) return;

                    const newAttachment = {
                        id: 'att_url_' + Date.now(),
                        title: titleInput || 'Tautan Eksternal',
                        url: urlInput,
                        mediaType: typeInput,
                        isExternalUrl: true,
                        uploadedAt: new Date().toLocaleDateString('id-ID'),
                        uploadedBy: contributorName
                    };
                    onMediaAdded(newAttachment);
                    setUrlInput('');
                    setTitleInput('');
                    showToast('Tautan eksternal berhasil ditambahkan!');
                };

                return (

                                    onClick={() => setMode('upload')}
                                    className={`px-3 py-1 rounded-md transition ${mode === 'upload' ? 'bg-brand-green text-white font-bold' : 'text-gray-600 hover:text-brand-dark'}`}
                                >
                                    📁 Unggah File
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setMode('url')}
                                    className={`px-3 py-1 rounded-md transition ${mode === 'url' ? 'bg-brand-green text-white font-bold' : 'text-gray-600 hover:text-brand-dark'}`}

                                        e.preventDefault();
                                        setDragOver(false);
                                        handleFiles(e.dataTransfer.files);
                                    }}
                                    className={`border-2 border-dashed rounded-xl p-5 text-center transition cursor-pointer ${
                                        dragOver ? 'border-brand-green bg-emerald-100/50' : 'border-emerald-300 bg-white hover:border-brand-mint'

                                >
                                    <input
                                        type="file"
                                        multiple
                                        id="media-file-input"
                                        className="hidden"
                                        onChange={(e) => handleFiles(e.target.files)}

                                    </label>
                                </div>

                                {isUploading && (
                                    <div className="mt-3">

                                            <span>Mengunggah file...</span>
                                            <span>{uploadProgress}%</span>
                                        </div>
                                        <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                                            <div className="bg-brand-mint h-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>

            // Universal Attachment List Manager Component (View, Replace, Metadata Edit, Remove)
            const UniversalAttachmentManager = ({ attachments = [], onUpdateAttachments }) => {
                const [editingAttachmentId, setEditingAttachmentId] = useState(null);
                const [metaTitle, setMetaTitle] = useState('');

                const handleRemove = (id) => {
                    if (confirm('Apakah kamu yakin ingin menghapus lampiran ini?')) {
                        const updated = attachments.filter(a => a.id !== id);
                        onUpdateAttachments(updated);
                        showToast('Lampiran berhasil dihapus.');
                    }
                };

                const handleReplaceFile = (id, newFile) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const updated = attachments.map(att => {
                            if (att.id === id) {
                                return {
                                    ...att,
                                    title: newFile.name,
                                    url: e.target.result,
                                    fileSize: (newFile.size / 1024 / 1024).toFixed(2) + ' MB'
                                };
                            }
                            return att;
                        });
                        onUpdateAttachments(updated);
                        showToast('File lampiran berhasil diganti!');
                    };
                    reader.readAsDataURL(newFile);
                };

                const handleSaveMeta = (id) => {
                    const updated = attachments.map(att => att.id === id ? { ...att, title: metaTitle } : att);
                    onUpdateAttachments(updated);
                    setEditingAttachmentId(null);
                    showToast('Judul lampiran diperbarui.');
                };

                if (!attachments || attachments.length === 0) {
                    return <p className="text-xs text-gray-400 italic py-1">Belum ada lampiran file/URL tambahan.</p>;
                }

                return (
                    <div className="space-y-2 my-2">
                        {attachments.map((item) => (
                            <div key={item.id} className="flex items-center justify-between bg-white p-2.5 rounded-lg border text-xs shadow-sm hover:border-emerald-300 transition">
                                <div className="flex items-center gap-2 overflow-hidden pr-2">
                                    <span className="text-base">
                                        {item.mediaType === 'image' ? '🖼️' : item.mediaType === 'video' ? '🎥' : '📄'}
                                    </span>
                                    {editingAttachmentId === item.id ? (
                                        <div className="flex items-center gap-1">
                                            <input
                                                type="text"
                                                value={metaTitle}
                                                onChange={(e) => setMetaTitle(e.target.value)}
                                                className="border rounded px-1.5 py-0.5 text-xs"
                                            />
                                            <button onClick={() => handleSaveMeta(item.id)} className="bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px]">Simpan</button>
                                        </div>
                                    ) : (
                                        <div className="truncate">
                                            <a href={item.url} target="_blank" rel="noreferrer" className="font-semibold text-brand-dark hover:text-brand-green hover:underline">
                                                {item.title || 'Lampiran File'}
                                            </a>
                                            <p className="text-[10px] text-gray-400">
                                                {item.fileSize ? `${item.fileSize} • ` : ''}Diunggah oleh {item.uploadedBy || 'Kontributor'}

                                <div className="flex items-center gap-1 shrink-0">
                                    {/* Replace Button */}

                                        🔄 Ganti File
                                        <input
                                            type="file"
                                            className="hidden"
                                            onChange={(e) => {
                                                if (e.target.files[0]) handleReplaceFile(item.id, e.target.files[0]);
                                            }}
                                        />

                                    {/* Edit Meta */}

                                        type="button"
                                        onClick={() => { setEditingAttachmentId(item.id); setMetaTitle(item.title); }}

            // Universal Edit Modal Component (Handles all DB collections dynamic forms)

            };

            // Global Search Modal
            const SearchModal = ({ onClose, query, setQuery, results }) => (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-start justify-center pt-20 p-4">

                                        <span className="text-xs text-brand-mint">→</span>
                                    </div>
                                ))

                        </div>
                    </div>

            // Compute Search Results
            const searchResults = useMemo(() => {
                if (!searchQuery.trim()) return [];
                const q = searchQuery.toLowerCase();
                const res = [];

                members.forEach(m => {
                    if (m.name.toLowerCase().includes(q) || m.position.toLowerCase().includes(q)) {
                        res.push({ type: 'Anggota', title: m.name, desc: m.position, tab: 'anggota' });
                    }
                });
                programs.forEach(p => {
                    if (p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)) {
                        res.push({ type: 'Program Kerja', title: p.title, desc: p.category, tab: 'program' });
                    }
                });
                news.forEach(n => {
                    if (n.title.toLowerCase().includes(q) || n.summary.toLowerCase().includes(q)) {
                        res.push({ type: 'Berita', title: n.title, desc: n.category, tab: 'berita' });
                    }
                });
                documents.forEach(d => {
                    if (d.title.toLowerCase().includes(q) || d.category.toLowerCase().includes(q)) {

                return res;

                { id: 'logbook', label: 'Logbook' },

                                    </button>
                                    <button onClick={() => { setEditingItem({ type: 'cycle', data: { number: cycles.length + 1, title: '', description: '', date: '', location: '', output: '', cover: '' } }); setIsContributeOpen(false); }} className="p-3 bg-emerald-50 hover:bg-emerald-100 text-brand-dark rounded-xl font-bold border border-emerald-200 text-left">
                                        🔄 Tambah Siklus
                                    </button>
                                    <button onClick={() => { setEditingItem({ type: 'program', data: { title: '', category: '', description: '', objective: '', target: '', date: '', location: '', result: '', cover: '' } }); setIsContributeOpen(false); }} className="p-3 bg-emerald-50 hover:bg-emerald-100 text-brand-dark rounded-xl font-bold border border-emerald-200 text-left">

                                        📰 Tambah Berita
                                    </button>
                                    <button onClick={() => { setEditingItem({ type: 'video', data: { title: '', description: '', category: 'Dokumenter', videoUrl: '', videoType: 'youtube', date: new Date().toISOString().split('T')[0] } }); setIsContributeOpen(false); }} className="p-3 bg-emerald-50 hover:bg-emerald-100 text-brand-dark rounded-xl font-bold border border-emerald-200 text-left">
                                        🎥 Tambah Video
                                    </button>
                                    <button onClick={() => { setEditingItem({ type: 'article', data: { title: '', author: contributorName, category: 'Jurnal', abstract: '', content: '', date: new Date().toISOString().split('T')[0] } }); setIsContributeOpen(false); }} className="p-3 bg-emerald-50 hover:bg-emerald-100 text-brand-dark rounded-xl font-bold border border-emerald-200 text-left">
                                        ✍️ Tulis Artikel
                                    </button>
                                    <button onClick={() => { setEditingItem({ type: 'document', data: { title: '', category: 'Umum', fileName: '', fileUrl: '', uploadedBy: contributorName } }); setIsContributeOpen(false); }} className="p-3 bg-emerald-50 hover:bg-emerald-100 text-brand-dark rounded-xl font-bold border border-emerald-200 text-left">
                                        📄 Upload Dokumen
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Search Modal */}
                    {isSearchOpen && (
                        <SearchModal
                            onClose={() => setIsSearchOpen(false)}
                            query={searchQuery}
                            setQuery={setSearchQuery}
                            results={searchResults}
                        />
                    )}

                    {/* Dynamic Edit Modal for CRUD */}
                    {editingItem && (
                        <UniversalEditModal
                            item={editingItem.data}
                            type={editingItem.type}
                            onClose={() => setEditingItem(null)}
                            onSave={(savedData) => {
                                const { type } = editingItem;
                                logRevision(`Memperbarui data ${type}: ${savedData.title || savedData.name || 'Hero'}`);

                                if (type === 'hero') {
                                    setHeroContent(savedData);
                                } else if (type === 'member') {
                                    setMembers(prev => savedData.id ? prev.map(m => m.id === savedData.id ? savedData : m) : [...prev, { ...savedData, id: 'm_' + Date.now() }]);
                                } else if (type === 'cycle') {
                                    setCycles(prev => savedData.id ? prev.map(c => c.id === savedData.id ? savedData : c) : [...prev, { ...savedData, id: 'c_' + Date.now() }]);
                                } else if (type === 'program') {
                                    setPrograms(prev => savedData.id ? prev.map(p => p.id === savedData.id ? savedData : p) : [...prev, { ...savedData, id: 'p_' + Date.now() }]);
                                } else if (type === 'activity') {
                                    setActivities(prev => savedData.id ? prev.map(a => a.id === savedData.id ? savedData : a) : [...prev, { ...savedData, id: 'act_' + Date.now() }]);
                                } else if (type === 'news') {
                                    setNews(prev => savedData.id ? prev.map(n => n.id === savedData.id ? savedData : n) : [...prev, { ...savedData, id: 'n_' + Date.now() }]);
                                } else if (type === 'video') {
                                    setVideos(prev => savedData.id ? prev.map(v => v.id === savedData.id ? savedData : v) : [...prev, { ...savedData, id: 'v_' + Date.now() }]);
                                } else if (type === 'article') {
                                    setArticles(prev => savedData.id ? prev.map(a => a.id === savedData.id ? savedData : a) : [...prev, { ...savedData, id: 'a_' + Date.now() }]);
                                } else if (type === 'document') {
                                    setDocuments(prev => savedData.id ? prev.map(d => d.id === savedData.id ? savedData : d) : [...prev, { ...savedData, id: 'd_' + Date.now() }]);
                                }
                                showToast('Data berhasil disimpan!');
                            }}
                            onDelete={(id) => {
                                const { type } = editingItem;
                                logRevision(`Hapus data ${type} ID ${id}`);
                                if (type === 'member') setMembers(prev => prev.filter(m => m.id !== id));
                                if (type === 'cycle') setCycles(prev => prev.filter(c => c.id !== id));
                                if (type === 'program') setPrograms(prev => prev.filter(p => p.id !== id));
                                if (type === 'news') setNews(prev => prev.filter(n => n.id !== id));
                                if (type === 'video') setVideos(prev => prev.filter(v => v.id !== id));
                                if (type === 'article') setArticles(prev => prev.filter(a => a.id !== id));
                                if (type === 'document') setDocuments(prev => prev.filter(d => d.id !== id));
                                showToast('Data berhasil dihapus dari database.');
                            }}
                        />
                    )}

                    {/* MAIN CONTENT AREA BY TAB */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
                        {/* 1. BERANDA */}
                        {activeTab === 'beranda' && (
                            <div className="space-y-12">
                                {/* Editorial Hero Card */}
                                <div className="relative rounded-3xl overflow-hidden bg-brand-dark text-white p-8 md:p-14 border border-emerald-900 shadow-2xl">

                                    <div className="relative z-10 max-w-3xl space-y-4">
                                        <div className="flex items-center gap-2">
                                            <span className="badge-pill bg-brand-mint/20 text-brand-mint border border-brand-mint/30">KKN SISDAMAS 2026</span>
                                            <button
                                                onClick={() => setEditingItem({ type: 'hero', data: heroContent })}
                                                className="bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1"
                                            >
                                                ✏️ Edit Hero
                                            </button>
                                        </div>

                                        <p className="text-brand-mint text-sm md:text-base font-semibold">{heroContent.heroSubtitle}</p>
                                        <p className="text-brand-peach italic font-serif text-lg md:text-xl">{heroContent.heroTheme}</p>
                                        <p className="text-emerald-100/80 text-sm leading-relaxed">{heroContent.heroDescription}</p>

                                        <div className="pt-4 flex flex-wrap gap-3">
                                            <button onClick={() => setActiveTab('program')} className="bg-brand-mint hover:bg-brand-green text-brand-dark hover:text-white px-5 py-2.5 rounded-xl font-bold text-xs transition shadow-lg">

                                            </button>
                                            <button onClick={() => setActiveTab('absensi')} className="bg-white/10 hover:bg-white/20 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition border border-white/20">

                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Dynamic Database Statistics Cards */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm text-center">
                                        <div className="text-3xl font-heading font-extrabold text-brand-green">{stats.totalMembers}</div>
                                        <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mt-1">Anggota Kelompok</div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm text-center">
                                        <div className="text-3xl font-heading font-extrabold text-brand-green">{stats.totalPrograms}</div>

                                    </div>
                                    <div className="bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm text-center">
                                        <div className="text-3xl font-heading font-extrabold text-brand-green">{stats.totalCycles}</div>

                                    <div className="bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm text-center">
                                        <div className="text-3xl font-heading font-extrabold text-brand-green">{stats.attendanceDays}</div>

                                    </div>
                                </div>

                                <div className="bg-emerald-50/60 p-6 md:p-10 rounded-3xl border border-emerald-200">

                                </div>

                                {/* Dynamic Attendance Statistics Summary */}
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    {(() => {
                                        let totalHadir = 0, totalIzin = 0, totalSakit = 0, totalAlpa = 0;
                                        let totalSlots = members.length * 35;
                                        members.forEach(m => {
                                            for (let d = 1; d <= 35; d++) {
                                                const st = attendance[m.id]?.[`day_${d}`] || 'Hadir';
                                                if (st === 'Hadir') totalHadir++;
                                                if (st === 'Izin') totalIzin++;
                                                if (st === 'Sakit') totalSakit++;
                                                if (st === 'Alpa') totalAlpa++;
                                            }
                                        });
                                        const pct = totalSlots > 0 ? ((totalHadir / totalSlots) * 100).toFixed(1) : 100;
                                        return (
                                            <>
                                                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-center">
                                                    <div className="text-xs text-brand-green font-bold uppercase">Tingkat Kehadiran</div>
                                                    <div className="text-2xl font-heading font-extrabold text-brand-deep">{pct}%</div>
                                                </div>
                                                <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl text-center">
                                                    <div className="text-xs text-blue-800 font-bold uppercase">Total Hadir</div>
                                                    <div className="text-2xl font-heading font-extrabold text-blue-900">{totalHadir}</div>
                                                </div>
                                                <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-center">
                                                    <div className="text-xs text-amber-800 font-bold uppercase">Izin / Sakit</div>
                                                    <div className="text-2xl font-heading font-extrabold text-amber-900">{totalIzin + totalSakit}</div>
                                                </div>
                                                <div className="bg-red-50 border border-red-200 p-3 rounded-xl text-center">
                                                    <div className="text-xs text-red-800 font-bold uppercase">Alpa</div>
                                                    <div className="text-2xl font-heading font-extrabold text-red-900">{totalAlpa}</div>
                                                </div>
                                            </>
                                        );
                                    })()}
                                </div>

                                {/* Scrollable 35-Day Matrix Table */}
                                <div className="bg-white rounded-2xl border border-emerald-100 shadow-sm overflow-x-auto custom-scrollbar">
                                    <table className="w-full text-left text-xs border-collapse min-w-max">
                                        <thead>
                                            <tr className="bg-brand-dark text-white font-heading">
                                                <th className="p-3 sticky left-0 bg-brand-dark z-10 border-r border-brand-deep">Nama Anggota</th>
                                                <th className="p-3 text-center border-r border-brand-deep">Jabatan</th>
                                                {Array.from({ length: 35 }, (_, i) => (
                                                    <th key={i} className="p-2 text-center min-w-[40px] border-r border-brand-deep/50 text-[11px]">
                                                        H{i+1}
                                                    </th>
                                                ))}
                                                <th className="p-3 text-center">Total Hadir</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {members.map((m, idx) => {
                                                let hCount = 0;
                                                return (
                                                    <tr key={m.id} className={idx % 2 === 0 ? 'bg-white' : 'bg-emerald-50/30'}>
                                                        <td className="p-3 font-bold text-brand-dark sticky left-0 bg-white border-r border-emerald-100 shadow-sm">
                                                            {m.name}
                                                        </td>
                                                        <td className="p-3 text-gray-500 border-r border-emerald-100">{m.position}</td>
                                                        {Array.from({ length: 35 }, (_, i) => {
                                                            const dayKey = `day_${i+1}`;
                                                            const status = attendance[m.id]?.[dayKey] || 'Hadir';
                                                            if (status === 'Hadir') hCount++;

                                                            return (
                                                                <td key={i} className="p-1 text-center border-r border-emerald-100/60">
                                                                    <button
                                                                        onClick={() => {
                                                                            const statuses = ['Hadir', 'Izin', 'Sakit', 'Alpa'];
                                                                            const nextStatus = statuses[(statuses.indexOf(status) + 1) % statuses.length];
                                                                            setAttendance(prev => ({
                                                                                ...prev,
                                                                                [m.id]: {
                                                                                    ...prev[m.id],
                                                                                    [dayKey]: nextStatus
                                                                                }
                                                                            }));
                                                                        }}
                                                                        className={`w-7 h-7 rounded font-bold text-[10px] transition ${
                                                                            status === 'Hadir' ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' :
                                                                            status === 'Izin' ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' :
                                                                            status === 'Sakit' ? 'bg-blue-100 text-blue-800 hover:bg-blue-200' :
                                                                            'bg-red-100 text-red-800 hover:bg-red-200'
                                                                        }`}
                                                                        title={`Hari ke-${i+1}: ${status} (Klik untuk ubah)`}
                                                                    >
                                                                        {status[0]}
                                                                    </button>
                                                                </td>
                                                            );
                                                        })}
                                                        <td className="p-3 text-center font-bold text-brand-green bg-emerald-50">
                                                            {hCount} / 35
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 13. DOKUMEN */}
                        {activeTab === 'dokumen' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center border-b pb-4">
                                    <div>
                                        <h2 className="text-2xl font-heading font-bold text-brand-dark">Arsip Dokumen Resmi (PDF, DOCX, XLSX, PPTX, CSV)</h2>
                                        <p className="text-xs text-gray-500">Penyimpanan file terpusat lengkap dengan kontrol ganti file dan unduh.</p>
                                    </div>
                                </div>

                                <UniversalMediaUploader
                                    label="Upload Dokumen Resmi Baru"
                                    onMediaAdded={(newMedia) => {
                                        const newDoc = {
                                            id: 'd_' + Date.now(),
                                            title: newMedia.title,
                                            description: 'Dokumen diunggah oleh ' + contributorName,
                                            category: 'Arsip',
                                            fileName: newMedia.title,
                                            fileType: newMedia.fileType || 'application/pdf',
                                            fileSize: newMedia.fileSize || '1.0 MB',
                                            fileUrl: newMedia.url,
                                            date: new Date().toISOString().split('T')[0],
                                            uploadedBy: contributorName
                                        };
                                        setDocuments(prev => [newDoc, ...prev]);
                                    }}
                                />

                                <div className="space-y-3">
                                    {documents.map((docItem) => (
                                        <div key={docItem.id} className="bg-white p-4 rounded-2xl border border-emerald-100 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-xl bg-emerald-100 text-brand-green flex items-center justify-center font-bold text-lg">
                                                    📄
                                                </div>
                                                <div>
                                                    <h4 className="font-heading font-bold text-sm text-brand-dark">{docItem.title}</h4>
                                                    <p className="text-xs text-gray-500">{docItem.fileName} • {docItem.fileSize} • Diunggah: {docItem.uploadedBy}</p>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-2">
                                                <a
                                                    href={docItem.fileUrl}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="bg-brand-green hover:bg-brand-deep text-white px-3 py-1.5 rounded-xl text-xs font-bold transition"
                                                >
                                                    ⬇️ Unduh / Buka
                                                </a>
                                                <button
                                                    onClick={() => setEditingItem({ type: 'document', data: docItem })}
                                                    className="bg-emerald-50 hover:bg-emerald-100 text-brand-green px-3 py-1.5 rounded-xl text-xs font-bold transition"
                                                >
                                                    ✏️ Edit & Ganti
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-brand-dark text-white border-t border-brand-deep py-8 px-4 mt-auto">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-emerald-200/70">
                            <div>
                                <h4 className="font-heading font-bold text-white text-base">KKN 224 JAYANTARA (2026)</h4>
                                <p>Desa Mekarjaya, Kecamatan Sukaluyu, Kabupaten Cianjur • UIN SGD Bandung</p>
                            </div>
                            <div className="text-center md:text-right">
                                <p className="italic font-serif">“This isn't just where our report lives. This is where our story continues.”</p>
                                <p className="mt-1 text-[10px] text-emerald-400">Database & Media Storage Engine Active • Real-time Editable</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
